<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المعتزل بوقاصد اليافعي</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
html,body{margin:0;min-height:100%;overflow-x:hidden;position:relative}
body{background:linear-gradient(var(--overlay-strong),var(--overlay)),url("https://raw.githubusercontent.com/albdallhbdalqwy24-pixel/hshwhwh/6ac937e46630e7e5ea886fec205b8c14ce0327ba/IMG_20260106_023922_255.jpg") center/cover fixed;color:var(--txt);}
body[data-theme="dark"]{--overlay:rgba(0,0,0,.45);--overlay-strong:rgba(0,0,0,.85);--card:rgba(18,18,24,.88);--txt:#f2f2f6;--muted:#b9b9c6;--accent:#ff2a2a;--accent2:#ff6b6b;--progress:#ff4d4d;}
body[data-theme="blue"]{--overlay:rgba(5,10,25,.45);--overlay-strong:rgba(5,10,25,.9);--card:rgba(15,20,40,.9);--txt:#eef1ff;--muted:#b8c0ff;--accent:#4f7cff;--accent2:#6ea0ff;--progress:#4f7cff;}
body[data-theme="purple"]{--overlay:rgba(20,0,30,.45);--overlay-strong:rgba(20,0,30,.9);--card:rgba(40,20,55,.9);--txt:#f7efff;--muted:#d1bfff;--accent:#b66cff;--accent2:#d39bff;--progress:#b66cff;}
body[data-theme="green"]{--overlay:rgba(0,20,10,.45);--overlay-strong:rgba(0,30,15,.9);--card:rgba(10,35,25,.9);--txt:#eafff6;--muted:#a6f3d1;--accent:#3ddc97;--accent2:#6fffc1;--progress:#3ddc97;}
.container{max-width:520px;margin:auto;padding:24px;position:relative;z-index:1}
.card{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--card);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.7),0 0 0 1px rgba(255,42,42,.04);backdrop-filter:blur(16px);animation:enter .7s ease;transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;} .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 32%,transparent);box-shadow:0 30px 80px rgba(0,0,0,.72),0 0 28px color-mix(in srgb,var(--accent) 10%,transparent);} body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(circle at 18% 18%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 34%),radial-gradient(circle at 82% 72%,color-mix(in srgb,var(--accent2) 16%,transparent),transparent 30%);filter:blur(20px);animation:aurora 18s ease-in-out infinite alternate;} @keyframes aurora{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1%,0) scale(1.08)}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:22px;margin:0;transition:.5s}
.icon-btn{background:none;border:none;font-size:16px;color:var(--txt);cursor:pointer;padding:6px 10px;border-radius:12px;transition:.3s}
.icon-btn:hover{background:rgba(255,255,255,.1)}
label{font-size:13px;color:var(--muted)}
input,textarea{width:100%;margin:6px 0 14px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(10,10,14,.6);color:var(--txt);transition:background-color .2s,border-color .2s,box-shadow .2s;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input:hover,textarea:hover{background:rgba(10,10,14,.75)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 15px var(--accent);border-color:var(--accent)}
input:active,textarea:active{box-shadow:0 0 15px var(--accent2) inset}
textarea{min-height:120px}
button.main{width:100%;padding:15px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;cursor:pointer;transition:.3s}
button.main:hover{transform:scale(1.015);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent)} button:active{transform:scale(.98)!important} button:disabled{opacity:.68;cursor:wait;transform:none!important} .actions button:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.18)} .draft-status{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;min-height:16px;transition:color .2s ease} .preview-modal{position:fixed;inset:0;z-index:10001;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);animation:fadeIn .2s ease} .preview-modal[hidden]{display:none} .preview-card{width:min(520px,100%);max-height:min(680px,90vh);overflow:auto;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.72)} .preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.preview-head h2{margin:0;color:var(--accent2);font-size:19px}.preview-close{border:0;background:rgba(255,255,255,.1);color:var(--txt);width:34px;height:34px;border-radius:50%;font-size:22px;cursor:pointer}.preview-field{margin:10px 0;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.preview-field strong{display:block;color:var(--accent2);font-size:12px;margin-bottom:5px}.preview-field p{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--txt);line-height:1.55;font-size:13px}.preview-modal .actions{margin-top:14px}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{flex:1;padding:10px;border-radius:12px;border:none;cursor:pointer;background:rgba(255,255,255,.1);color:var(--txt);display:flex;justify-content:center;align-items:center;gap:6px;transition:.3s}
.actions button:hover{background:rgba(255,255,255,.2)}
.counter{margin-top:10px;font-size:13px;text-align:center;color:var(--muted);position:relative}
.counter b{display:inline-block;background:red;color:#fff;padding:2px 8px;border-radius:12px;margin-left:6px;transition:.3s}
#progress-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
#progress-fill{height:100%;width:0%;background:var(--progress);border-radius:6px;transition:width .5s,background .5s}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;opacity:.85}
.footer a:hover{color:var(--accent)}

#extras{display:none;flex-direction:column;gap:12px;overflow-y:auto;transition:max-height .5s ease,opacity .5s ease;max-height:0;padding-right:6px}
.extra-row{display:flex;gap:10px;align-items:center;transition:.5s,transform .5s,opacity .5s;animation:slideIn .5s ease forwards}
.extra-row input,.extra-row textarea{flex:1;border:1px solid rgba(255,255,255,.3)}
.extra-row button.del{flex:none;background:red;color:#fff;border:none;border-radius:12px;padding:6px 10px;cursor:pointer;transition:.3s}
.extra-row button.del:hover{background:#ff4d4d}

#toggleExtras{margin-top:12px;width:100%;padding:12px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;cursor:pointer;transition:.3s}
#toggleExtras:hover{transform:scale(1.03);box-shadow:0 0 15px var(--accent)}

#autoToggle{margin-top:12px;} /* مسافة أسفل زر الإضافات */

#addText{margin-top:6px;padding:10px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;cursor:pointer;transition:.3s}
#addText:hover{transform:scale(1.03);box-shadow:0 0 12px var(--accent2)}

.snowflake{position:fixed;top:-10px;color:white;user-select:none;pointer-events:none;z-index:9999;font-size:1em;animation-name:fall;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(100vh) rotate(360deg)}}
@keyframes slideIn{0%{opacity:0;transform:translateY(-15px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) scale(0);background:var(--accent);color:#fff;padding:12px 20px;border-radius:14px;z-index:9999;font-weight:800;transition:transform .4s ease,opacity .4s ease;opacity:0}
.toast.show{transform:translateX(-50%) scale(1);opacity:1;animation:toastPulse .6s ease infinite}
@keyframes toastPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.welcome-overlay{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));display:flex;justify-content:center;padding:0;background:transparent;z-index:10000;pointer-events:none}.welcome-box{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--accent);border-radius:16px;padding:14px 18px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 18px color-mix(in srgb,var(--accent) 25%,transparent);animation:noticeIn .45s ease;pointer-events:none}.welcome-box h2{margin:0 0 6px;font-size:18px;color:var(--accent2)}.welcome-box p{margin:0;line-height:1.55;font-size:13px}.welcome-progress{height:4px;margin-top:20px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden}.welcome-progress span{display:block;height:100%;width:100%;background:var(--accent);transform-origin:right;animation:noticeTimer 10s linear forwards}@keyframes overlayIn{from{opacity:0}to{opacity:1}}@keyframes noticeIn{from{opacity:0;transform:translateY(15px) scale(.96)}to{opacity:1;transform:none}}@keyframes noticeTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}@media(max-width:560px){h1{font-size:20px}input,textarea,button{font-size:14px}}
</style>
</head>
<body data-theme="dark">

<div class="container">
<div class="card">
<div class="header">
<h1 id="title">المعتزل بوقاصد اليافعي</h1>
<div>
<button id="theme" class="icon-btn">🎨</button>
<button id="lang" class="icon-btn">🇺🇸 English</button>
</div>
</div>

<label id="l-email">بريد الدعم</label>
<input id="email" placeholder="abuse@telegram.org">

<label id="l-subject">الموضوع</label>
<input id="subject">

<label id="l-body">نص البلاغ</label>
<textarea id="body"></textarea>

<button class="main" id="send">📤 إرسال البلاغ</button>

<button id="toggleExtras">⚡ الإضافات</button>
<div id="extras">
  <button id="autoToggle" class="main">تفعيل التبديل التلقائي</button>
  <button id="addText" style="display:none">إضافة نصوص + موضوع</button>
</div>

<div class="actions">
<button id="copyAll">📋 نسخ البلاغ</button>
<button id="preview">👁 معاينة</button>
</div>
<div class="actions">
<button id="reuse">↺ استخدام آخر نص</button>
<button id="reset">🗑️ تصفير العداد</button>
</div>
<div id="draftStatus" class="draft-status" aria-live="polite"></div>

<div class="counter">
<span id="counter-text">عدد البلاغات المرسلة:</span> <b id="count">0</b>
<div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div class="footer">
<span>المعتزل بوقاصد اليافعي</span>
<a id="contact" href="https://t.me/vxxsmk" target="_blank" style="color:var(--txt);text-decoration:none">
تواصل مع المطور
</a>
</div>
</div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="previewModal" class="preview-modal" hidden>
  <div class="preview-card" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="preview-head"><h2 id="previewTitle">معاينة البلاغ</h2><button id="closePreview" class="preview-close" aria-label="إغلاق">×</button></div>
    <div class="preview-field"><strong id="previewToLabel">إلى</strong><p id="previewTo"></p></div>
    <div class="preview-field"><strong id="previewSubjectLabel">الموضوع</strong><p id="previewSubject"></p></div>
    <div class="preview-field"><strong id="previewBodyLabel">نص البلاغ</strong><p id="previewBody"></p></div>
  </div>
</div>

<div id="welcomeNotice" class="welcome-overlay" role="dialog" aria-live="polite">
  <div class="welcome-box">
    <h2>السلام عليكم</h2>
    <p>عدنا لكم بعد غياب، وعدنا لتعديل الأخطاء في الموقع، وأي أخطاء تصادفها راسلني عبر زر التواصل في أسفل الموقع.</p>
    <div class="welcome-progress" aria-hidden="true"><span></span></div>
  </div>
</div>

<script>
const d=i=>document.getElementById(i);
["email","subject","body"].forEach(id=>{ d(id).value=localStorage[id]||""; d(id).oninput=()=>{localStorage[id]=d(id).value;d("draftStatus").innerText=lang==="en"?"Draft saved on this device":"تم حفظ المسودة على هذا الجهاز";}; });

let count = Number(localStorage.count||0);
d("count").innerText = count;
function updateProgress(){ let p=Math.min((count/100)*100,100); d("progress-fill").style.width=p+"%"; }
updateProgress();

let extrasData=[]; 
let autoToggleActive=false;
const SWITCH_INTERVAL=5;
d("send").onclick=()=>{
 const sendBtn=d("send");
 sendBtn.disabled=true;
 const originalLabel=lang==="en"?"Send Report":"إرسال البلاغ";
 sendBtn.innerText=lang==="en"?"Preparing email...":"جاري تجهيز البريد...";
 setTimeout(()=>{sendBtn.disabled=false;sendBtn.innerText=originalLabel;},900);
 let e=d("email").value.trim()||"abuse@telegram.org";
 let s=encodeURIComponent(d("subject").value);
 let b=encodeURIComponent(d("body").value);
 localStorage.lastText=d("body").value;
 count+=1; localStorage.count=count; d("count").innerText=count; updateProgress();
 if(autoToggleActive && extrasData.length>0 && count%SWITCH_INTERVAL===0){
   let idx=Math.floor(Math.random()*extrasData.length);
   d("subject").value=extrasData[idx].subject;
   d("body").value=extrasData[idx].text;
 }
 const mailtoUrl=`mailto:${encodeURI(e)}?subject=${s}&body=${b}`;
	 const mailLink=document.createElement("a");
	 mailLink.href=mailtoUrl;
	 mailLink.style.display="none";
	 document.body.appendChild(mailLink);
	 mailLink.click();
	 setTimeout(()=>mailLink.remove(),1000);
};

d("reuse").onclick=()=>{if(localStorage.lastText){d("body").value=localStorage.lastText;localStorage.body=localStorage.lastText;showToast(lang==="en"?"Draft restored":"تمت استعادة آخر نص");}};
d("copyAll").onclick=async()=>{const text=`إلى: ${d("email").value||"abuse@telegram.org"}\nالموضوع: ${d("subject").value}\n\n${d("body").value}`;try{await navigator.clipboard.writeText(text);showToast(lang==="en"?"Report copied":"تم نسخ البلاغ")}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();showToast(lang==="en"?"Report copied":"تم نسخ البلاغ")}};
d("preview").onclick=()=>{d("previewTo").innerText=d("email").value||"abuse@telegram.org";d("previewSubject").innerText=d("subject").value||"—";d("previewBody").innerText=d("body").value||"—";d("previewModal").hidden=false;};
d("closePreview").onclick=()=>d("previewModal").hidden=true;
d("previewModal").onclick=e=>{if(e.target===d("previewModal"))d("previewModal").hidden=true;};
document.addEventListener("keydown",e=>{if(e.key==="Escape")d("previewModal").hidden=true;});
d("reset").onclick=()=>{if(confirm("هل تريد تصفير عداد البلاغات؟")){count=0;localStorage.count=0;d("count").innerText=0;updateProgress();}};

const themes=["dark","blue","purple","green"];
let ti=Number(localStorage.theme||0);
document.body.setAttribute("data-theme",themes[ti]);
d("theme").onclick=()=>{ti=(ti+1)%themes.length;document.body.setAttribute("data-theme",themes[ti]);localStorage.theme=ti;updateProgress();};

let lang = localStorage.lang || "ar";
const langBtn = d("lang");
const T = { 
 ar:{title:"المعتزل بوقاصد اليافعي",email:"بريد الدعم",subject:"الموضوع",body:"نص البلاغ",send:"إرسال البلاغ",reuse:"استخدام آخر نص",reset:"تصفير العداد",counter:"عدد البلاغات المرسلة:",contact:"تواصل مع المطور",copyAll:"📋 نسخ البلاغ",preview:"👁 معاينة",previewTitle:"معاينة البلاغ",to:"إلى",draftSaved:"تم حفظ المسودة على هذا الجهاز",btnText:"🇺🇸 English",extrasBtn:"⚡ الإضافات",autoToggle:"تفعيل التبديل التلقائي",addTextBtn:"إضافة نصوص + موضوع"},
 en:{title:"Bugaasd Al-Yafei (Retired)",email:"Support Email",subject:"Subject",body:"Report Text",send:"Send Report",reuse:"Use Last Text",reset:"Reset Counter",counter:"Reports sent:",contact:"Contact Developer",copyAll:"📋 Copy Report",preview:"👁 Preview",previewTitle:"Report Preview",to:"To",draftSaved:"Draft saved on this device",btnText:"🇾🇪 العربية",extrasBtn:"⚡ Extras",autoToggle:"Activate Auto-Switch",addTextBtn:"Add Text + Subject"} 
};
function updateExtrasLang(){
    const rows = document.querySelectorAll(".extra-row");
    rows.forEach(row=>{
        const inp = row.querySelector("input");
        const ta = row.querySelector("textarea");
        if(lang === "ar"){if(!row.dataset.custom){inp.placeholder = "موضوع";ta.placeholder = "نص";}}
        else{if(!row.dataset.custom){inp.placeholder = "Subject";ta.placeholder = "Text";}}
    });
}
function applyLang(){
 const t=T[lang];
 const card=d("title").parentElement.parentElement;
 card.style.opacity=0;
 setTimeout(()=>{
     document.documentElement.lang=lang;
     d("title").innerText=t.title;
     d("l-email").innerText=t.email;
     d("l-subject").innerText=t.subject;
     d("l-body").innerText=t.body;
     d("send").innerText=t.send;
     d("reuse").innerText=t.reuse;
     d("reset").innerText=t.reset;
 d("copyAll").innerText=t.copyAll;
 d("preview").innerText=t.preview;
 d("previewTitle").innerText=t.previewTitle;
 d("previewToLabel").innerText=t.to;
 d("counter-text").innerText=t.counter;
     d("contact").innerText=t.contact;
     d("toggleExtras").innerText=t.extrasBtn;
     d("autoToggle").innerText=t.autoToggle;
     d("addText").innerText=t.addTextBtn;
     updateExtrasLang();
     card.style.opacity=1;
 },200);
}
applyLang();
langBtn.onclick=()=>{lang=(lang==="ar")?"en":"ar";localStorage.lang=lang;applyLang();};

let extrasVisible=false;
d("toggleExtras").onclick=()=>{
 extrasVisible=!extrasVisible;
 const extras=d("extras");
 if(extrasVisible){extras.style.display="flex";setTimeout(()=>{extras.style.maxHeight="500px";extras.style.opacity=1;},10);}
 else{extras.style.maxHeight="0";extras.style.opacity=0;setTimeout(()=>{extras.style.display="none"},500);}
};
d("autoToggle").onclick=()=>{
 autoToggleActive=!autoToggleActive;
 showToast(lang==="ar"?"تم تفعيل التبديل التلقائي":"Auto-Switch Activated!");
 d("addText").style.display=autoToggleActive?"block":"none";
};
d("addText").onclick=()=>{
 let container=document.createElement("div");
 container.className="extra-row";
 container.innerHTML=`<input placeholder="${lang==='ar'?'موضوع':'Subject'}"><textarea placeholder="${lang==='ar'?'نص':'Text'}"></textarea><button class="del">❌</button>`;
 container.querySelector(".del").onclick=()=>{extrasData.splice(container.index,1);container.remove();}
 container.querySelectorAll("input,textarea").forEach((el,i)=>el.oninput=()=>{extrasData[container.index]={subject:container.querySelector("input").value,text:container.querySelector("textarea").value};});
 container.index=extrasData.length;
 extrasData.push({subject:"",text:""});
 d("extras").appendChild(container);
};

function showToast(msg){const toast=d("toast");toast.innerText=msg;toast.classList.add("show");setTimeout(()=>{toast.classList.remove("show")},2000)}

setTimeout(()=>{const notice=d("welcomeNotice");if(notice){notice.style.opacity="0";notice.style.transition="opacity .35s ease";setTimeout(()=>notice.remove(),350)}},10000);

for(let i=0;i<50;i++){
 let snow=document.createElement("div");
 snow.className="snowflake";
 snow.style.left=Math.random()*100+"%";
 snow.style.fontSize=(Math.random()*15+10)+"px";
 snow.style.animationDuration=(Math.random()*5+5)+"s";
 snow.style.opacity=Math.random();
 snow.innerText="❄";
 document.body.appendChild(snow);
}
</script>

  <script src="admin.js" defer></script>
</body>
</html>
