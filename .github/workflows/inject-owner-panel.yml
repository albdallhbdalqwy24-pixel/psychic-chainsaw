name: Inject owner panel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip owner-panel]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject admin script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="admin.js" defer></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('No </body> marker found in index.html')
              text = text.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit injected script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Enable hidden owner control panel [skip owner-panel]'
          git push
